<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍃 새 지출 적기</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #e8f5e9;
            background-image: radial-gradient(#c8e6c9 15%, transparent 16%);
            background-size: 24px 24px;
            color: #3e2723;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fffdf6;
            padding: 35px;
            border-radius: 30px;
            border: 4px solid #81c784;
            box-shadow: 0 10px 0 #66bb6a, 0 15px 25px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 28px;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 16px; color: #558b2f; }
        input[type="text"], input[type="date"], input[type="number"] {
            font-family: 'Jua', sans-serif;
            width: 100%;
            padding: 14px;
            border: 3px solid #c8e6c9;
            background-color: #f9fbe7;
            border-radius: 16px;
            font-size: 16px;
            box-sizing: border-box;
            color: #3e2723;
        }
        input:focus { outline: none; border-color: #ffb74d; background-color: #fff; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            font-family: 'Jua', sans-serif;
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.1s ease;
        }
        .btn-submit {
            background-color: #ffb74d;
            color: #5d4037;
            box-shadow: 0 5px 0 #f57c00;
        }
        .btn-cancel {
            background-color: #cfd8dc;
            color: #455a64;
            box-shadow: 0 5px 0 #90a4ae;
        }
        .btn:hover { transform: translateY(2px); }
        .btn-submit:hover { box-shadow: 0 3px 0 #f57c00; }
        .btn-cancel:hover { box-shadow: 0 3px 0 #90a4ae; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍃 새 지출 작성하기 📝</h1>

        <form action="/add" method="POST">
            <div class="form-group">
                <label for="date">📅 날짜</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="category">🏷️ 카테고리 (분류)</label>
                <input type="text" id="category" name="category" placeholder="예: 식비, 마일섬 티켓, 옷, 가구" required>
            </div>

            <div class="form-group">
                <label for="description">💬 사용 내용</label>
                <input type="text" id="description" name="description" placeholder="예: 무 주식 구매, 너굴 상점 쇼핑" required>
            </div>

            <div class="form-group">
                <label for="amount">🔔 금액 (벨)</label>
                <input type="number" id="amount" name="amount" min="1" placeholder="예: 12000" required>
            </div>

            <div class="btn-group">
                <a href="/" class="btn btn-cancel">취소</a>
                <button type="submit" class="btn btn-submit">벨 쓰기 완료!</button>
            </div>
        </form>
    </div>
</body>
</html>
